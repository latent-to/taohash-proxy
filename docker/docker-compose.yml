services:
  haproxy:
    image: haproxy:2.8-alpine
    container_name: taohash-haproxy
    ports:
      - "${PROXY_PORT:-3331}:3331"
      - "${PROXY_PORT_HIGH:-3332}:3332"
      - "8404:8404"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    networks:
      - taohash-network

  proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    deploy:
      replicas: 10
    volumes:
      - ../config:/app/config:ro
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PROXY_PORT=${PROXY_PORT:-3331}
      - PROXY_PORT_HIGH=${PROXY_PORT_HIGH:-3332}
      - CLICKHOUSE_REQUIRED=true
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-taohash123}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-taohash}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taohash123}
      - POSTGRES_DB=${POSTGRES_DB:-marketplace}
      - REDIS_HOST=redis
      - LOG_FILE=/app/logs/proxy.log
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - taohash-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: taohash-api
    entrypoint: [ "python", "-m", "uvicorn" ]
    command: [ "src.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log" ]
    ports:
      - "${API_PORT:-8888}:8000"
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      COIN: ${COIN:-btc}
      LOG_FILE: /app/logs/api.log
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - taohash-network

  market:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: taohash-market
    command: [ "python", "-m", "src.market.main" ]
    ports:
      - "${MARKET_HEALTH_PORT:-8001}:8001"
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      LOG_FILE: /app/logs/market.log
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - taohash-network

  redis:
    image: redis:7-alpine
    container_name: taohash-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - taohash-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: taohash-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-storage.xml:/etc/clickhouse-server/config.d/storage.xml
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-taohash123}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_ENDPOINT=${AWS_S3_ENDPOINT:-https://${AWS_S3_BUCKET}.s3.amazonaws.com}/clickhouse/
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - taohash-network

  postgres:
    image: postgres:16-alpine
    container_name: taohash-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-taohash}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taohash123}
      - POSTGRES_DB=${POSTGRES_DB:-marketplace}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taohash} -d ${POSTGRES_DB:-marketplace}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - taohash-network

  aggregator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: taohash-aggregator
    command: [ "python", "-m", "src.aggregator" ]
    ports:
      - "5000:5555"
    networks:
      - taohash-network
    depends_on:
      - proxy
    restart: unless-stopped

networks:
  taohash-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  clickhouse_data:
    driver: local
  postgres_data:
    driver: local
